name: Sync LDraw library

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check upstream ETag
        id: check
        run: |
          ETAG=$(curl -sSI https://library.ldraw.org/library/updates/complete.zip \
            | awk 'BEGIN{IGNORECASE=1}/^etag:/{print $2}' | tr -d '\r\n"')
          LOCAL=$(cat .upstream-etag 2>/dev/null || true)
          echo "etag=$ETAG" >> "$GITHUB_OUTPUT"
          if [ -n "$ETAG" ] && [ "$ETAG" = "$LOCAL" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch and extract
        if: steps.check.outputs.changed == 'true'
        run: |
          curl -sSL -o complete.zip https://library.ldraw.org/library/updates/complete.zip
          rm -rf ldraw/
          unzip -q complete.zip
          rm complete.zip
          echo "${{ steps.check.outputs.etag }}" > .upstream-etag

      - name: Commit and push
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f ldraw/ .upstream-etag
          if git diff --cached --quiet; then
            echo "ETag changed but content identical."
          else
            git commit -m "Sync LDraw library $(date -u +%Y-%m-%d)"
            git push
          fi
